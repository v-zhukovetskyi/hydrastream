[package]
name = "hydrastream_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "hydrastream_core"
crate-type = ["cdylib"] # Важно: собираем динамическую библиотеку C-API

[dependencies]
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py312"] }
regex = "1.13.1"       # Замена для re
url = "2.5.8"          # Замена для urllib.parse (мировой стандарт в Rust)
rand = "0.10.2"         # Для генерации случайных чисел
rand_distr = "0.6"   # Специалифицированный крейт для логнормального распределения (lognormvariate)
percent-encoding = "2.3.2" # Замена для email.utils.unquote / urllib.parse.unquote
